services:
  studyos:
    build:
      context: .
      dockerfile: Dockerfile
    image: studyos:local
    container_name: studyos
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATA_DIR: /app/data
      STATIC_DIR: /app/static
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-7}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    volumes:
      - studyos_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  studyos_data:
    name: studyos_data
